<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>홍대서버 | 우리들의 힙한 아지트</title>
    <style>
        /* 기본 스타일 초기화 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Noto Sans KR', sans-serif;
        }

        /* 🚀 배경을 이미지로 변경 (image_4.png 활용) */
        body {
            background-color: #202225; /* 폴백 색상 */
            background-image: url('images/hongdae_bg.png'); /* 이미지 경로 */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* 메인 카드 컨테이너 */
        .server-card {
            background-color: rgba(47, 49, 54, 0.85); /* 투명도 추가로 배경 보이게 */
            backdrop-filter: blur(5px); /* 배경 블러 효과 */
            border-radius: 20px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 460px;
            padding: 50px 30px 40px;
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .server-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 16px 40px rgba(88, 101, 242, 0.25);
        }

        /* 카드 상단 그라데이션 포인트 라인 */
        .card-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: linear-gradient(90deg, #5865F2, #ff416c);
        }

        /* 🚀 서버 아이콘을 이미지로 변경 (image_5.png 활용) */
        .server-icon {
            width: 130px; /* 크기 약간 키움 */
            height: 130px;
            background-image: url('images/hongdae_logo.png'); /* 이미지 경로 */
            background-size: cover;
            background-position: center;
            border-radius: 50%;
            margin: 0 auto 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            /* 네온 효과 유지 */
            box-shadow: 0 0 25px rgba(255, 75, 43, 0.6);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 15px rgba(88, 101, 242, 0.4); }
            50% { box-shadow: 0 0 30px rgba(255, 75, 43, 0.7); }
            100% { box-shadow: 0 0 15px rgba(88, 101, 242, 0.4); }
        }

        /* 서버 이름 */
        .server-name {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #fff, #b9bbbe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* 서버 태그 */
        .server-tags {
            margin-bottom: 25px;
        }

        .tag {
            display: inline-block;
            background-color: #36393f;
            color: #dcddde;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            margin: 4px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* 홍대 느낌 가미된 친목 멘트 */
        .server-description {
            font-size: 16px;
            color: #b9bbbe;
            line-height: 1.6;
            margin-bottom: 35px;
            word-break: keep-all;
            padding: 0 10px;
        }

        /* 초대 링크 버튼 */
        .join-btn {
            display: block;
            background-color: #5865F2;
            color: #ffffff;
            text-decoration: none;
            padding: 16px 0;
            border-radius: 12px;
            font-size: 19px;
            font-weight: 700;
            letter-spacing: 0.5px;
            transition: background-color 0.2s ease, transform 0.1s ease, box-shadow 0.2s ease;
        }

        .join-btn:hover {
            background-color: #4752c4;
            box-shadow: 0 6px 20px rgba(88, 101, 242, 0.4);
        }

        .join-btn:active {
            transform: scale(0.98);
        }

        /* 하단 카피라이트 */
        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #72767d;
        }
    </style>
</head>
<body>

    <div class="server-card">
        <div class="card-line"></div>

        <div class="server-icon"></div>
        
        <h1 class="server-name">홍대서버</h1>
        
        <div class="server-tags">
            <span class="tag">#친목</span>
            <span class="tag">#소통</span>
            <span class="tag">#일상공유</span>
            <span class="tag">#매너유저환영</span>
        </div>
        
        <p class="server-description">
            가장 트렌디하고 편안한 우리들의 아지트, 홍대서버입니다! <br>
            매일 소소한 일상 이야기부터 즐거운 소통까지 함께 나눌 좋은 사람들을 기다리고 있어요. 부담 없이 들어오셔서 같이 놀아요! 😎
        </p>
        
        <a href="https://discord.gg/XM7Mgj7xGQ" class="join-btn" target="_blank">지금 아지트 입장하기</a>
        
        <div class="footer">
            &copy; 2026 홍대서버. All rights reserved.
        </div>
    </div>

</body>
</html>
